<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>SAC GRUPO CHIACCHIO</title>
<style>
  :root {
    --red: #C70602;
    --red-dark: #A80502;
    --red-light: #FDEAEA;
    --sidebar-bg: #ffffff;
    --sidebar-text: #545252;
    --sidebar-active: #C70602;
    --brand-gray: #929090;
    --white: #FFFFFF;
    --gray-50: #F4F4F4;
    --gray-100: #F4F4F4;
    --gray-200: #E4E4E4;
    --gray-300: #D6D6D6;
    --gray-400: #929090;
    --gray-500: #666464;
    --gray-600: #545252;
    --gray-700: #3A3939;
    --gray-900: #1F1F1F;
    --yellow: #F59E0B;
    --yellow-light: #FEF3C7;
    --green: #10B981;
    --green-light: #D1FAE5;
    --orange: #F97316;
    --orange-light: #FED7AA;
    --table-head: #FAFAFA;
    --table-row-border: #EFEFEF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4F4F4; color: #1F1F1F; display: flex; height: 100vh; overflow: hidden; font-size: 14px; -webkit-font-smoothing: antialiased; }
  /* SIDEBAR */
  .sidebar { width: 232px; background: #fff; color: #545252; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #E4E4E4; }
  .sidebar-logo { padding: 18px 12px 18px; border-bottom: 0; }
  .sidebar-logo h2 { font-size: 13.5px; font-weight: 700; color: #1F1F1F; line-height: 1.2; }
  .sidebar-logo p { font-size: 11px; color: #929090; margin-top: 1px; letter-spacing: 0.04em; }
  .sidebar-section { padding: 4px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #929090; margin-bottom: 2px; margin-top: 14px; }
  .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; border-radius: 7px; margin: 0; color: #545252; font-size: 13.5px; font-weight: 500; width: 100%; text-align: left; border: 0; background: transparent; font-family: inherit; }
  .sidebar-item:hover { background: #F4F4F4; color: #1F1F1F; }
  .sidebar-item.active { background: #FDECEC; color: #C70602; font-weight: 600; }
  .sidebar-item svg { display: none; }
  .sidebar-dot { width: 6px; height: 6px; border-radius: 2px; flex-shrink: 0; background: #D0D0D0; }
  .sidebar-item.active .sidebar-dot { background: #C70602; }
  .sidebar-bottom { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid #E4E4E4; }
  .sidebar-link { font-size: 12.5px; color: #666464; display: flex; align-items: center; gap: 4px; padding: 4px; cursor: pointer; }
  .sidebar-link:hover { color: #C70602; }
  .sidebar-user { display: flex; align-items: center; gap: 8px; padding: 8px; margin-top: 8px; }
  .sidebar-user-avatar { width: 32px; height: 32px; background: #EEEEEE; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #545252; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .sidebar-user-info { min-width: 0; }
  .sidebar-user-name { font-size: 13px; font-weight: 500; color: #1F1F1F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user-role { font-size: 11.5px; color: #929090; letter-spacing: 0.03em; }
  /* Recuo do menu igual ao mockup */
  .sidebar { padding: 0 12px 12px; }
  .sidebar-logo { padding: 18px 6px; }
  .sidebar-bottom { padding: 14px 0 0; }
  /* MAIN */
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .page { display: none; flex-direction: column; flex: 1; }
  .page.active { display: flex; }
  /* TOPBAR / HEADER */
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-bottom: 1px solid #E4E4E4; padding: 12px 28px; display: flex; align-items: center; gap: 14px; }
  .topbar-left { flex: 1 1 auto; min-width: 180px; overflow: hidden; }
  .breadcrumb { font-size: 12px; color: #8A8888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 0; flex-wrap: nowrap; }
  .topbar-left .page-header { justify-content: flex-start; }
  .topbar-left .page-actions { display: none; }
  .page-title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; color: #1F1F1F; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar-search { flex: 0 1 260px; min-width: 90px; height: 36px; border: 1px solid #D6D6D6; border-radius: 8px; padding: 0 12px; background: #fff; font-size: 13px; font-family: inherit; outline: none; }
  .topbar-search:focus { border-color: #C70602; }
  .topbar-notif { flex: none; white-space: nowrap; height: 36px; display: flex; align-items: center; gap: 8px; border: 1px solid #D6D6D6; background: #fff; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .topbar-notif:hover { background: #F4F4F4; }
  .topbar-notif-badge { background: #C70602; color: #fff; border-radius: 99px; white-space: nowrap; font-size: 11px; padding: 1px 7px; font-weight: 600; }
  .topbar-user { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; text-align: left; padding: 0; font-family: inherit; }
  .topbar-user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #EEEEEE; display: grid; place-items: center; font-weight: 600; font-size: 12.5px; color: #545252; flex-shrink: 0; }
  .topbar-user-name { font-size: 13px; font-weight: 500; color: #1F1F1F; }
  .topbar-user-role { font-size: 11.5px; color: #8A8888; }
  .badge-mockup { font-size: 11px; color: var(--gray-400); }
  /* content padding below topbar */
  .content { padding: 24px 28px 56px; flex: 1; }
  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap; }
  .btn-primary { background: #C70602; color: white; border: 0; }
  .btn-primary:hover { background: #A80502; }
  .btn-secondary { background: white; color: #1F1F1F; border: 1px solid #D6D6D6; }
  .btn-secondary:hover { background: #F4F4F4; }
  .btn-ghost { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-ghost:hover { background: var(--red-light); }
