name: Registrar baseline Prisma (produção)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Digite PRODUCTION para confirmar o destino"
        required: true
        type: string
      authorize_baseline:
        description: "Digite APLICAR_BASELINE para registrar somente a migração init"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prisma-baseline-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Validar estrutura e registrar baseline no Neon production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    if: ${{ github.event.inputs.confirm_production == 'PRODUCTION' && github.event.inputs.authorize_baseline == 'APLICAR_BASELINE' }}
    services:
      prisma-shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma-shadow-only
          POSTGRES_DB: prisma_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # A URL direta é usada somente durante esta execução administrativa.
      # O mesmo valor atende DATABASE_URL e DATABASE_URL_UNPOOLED porque o
      # schema do Prisma exige ambas as variáveis no carregamento.
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      EXPECTED_NEON_HOSTNAME: ${{ secrets.NEON_PRODUCTION_HOSTNAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.NEON_PRODUCTION_DATABASE_NAME }}
      SHADOW_DATABASE_URL: postgresql://prisma:prisma-shadow-only@127.0.0.1:5432/prisma_shadow

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Confirmar destino Neon sem expor credenciais
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const parsed = new URL(process.env.DATABASE_URL);
          const expectedHost = process.env.EXPECTED_NEON_HOSTNAME;
          if (!expectedHost || parsed.hostname !== expectedHost) {
            throw new Error('Destino recusado: o host da conexão não corresponde ao host Neon de produção configurado.');
          }
          if (!process.env.EXPECTED_DATABASE_NAME) {
            throw new Error('Destino recusado: secret NEON_PRODUCTION_DATABASE_NAME não configurado.');
          }
          const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: true } });
          (async () => {
            await client.connect();
            const result = await client.query('SELECT current_database() AS database_name');
            const actual = String(result.rows[0]?.database_name || '');
            await client.end();
            if (actual !== process.env.EXPECTED_DATABASE_NAME) {
              throw new Error('Destino recusado: o nome do banco não corresponde ao banco Neon de produção configurado.');
            }
            console.log('Destino confirmado: host e banco Neon de produção correspondem aos valores esperados.');
          })().catch(async error => {
            try { await client.end(); } catch {}
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Validar migração init e divergências permitidas (somente leitura)
        run: |
          set -euo pipefail
          temp_migrations="$(mktemp -d)"
          diff_file=""
          trap 'rm -rf "$temp_migrations" ${diff_file:+"$diff_file"}' EXIT
          cp prisma/migrations/migration_lock.toml "$temp_migrations/migration_lock.toml"
          cp -R prisma/migrations/20260930000001_init "$temp_migrations/20260930000001_init"
          diff_file="$(mktemp)"
          npx prisma migrate diff \
            --from-url "$DATABASE_URL_UNPOOLED" \
            --to-migrations "$temp_migrations" \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > "$diff_file"

          DIFF_FILE="$diff_file" node <<'NODE'
          const fs = require('fs');
          const actual = fs.readFileSync(process.env.DIFF_FILE, 'utf8')
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line && !line.startsWith('--'))
            .join('\n')
            .split(';')
            .map(statement => statement.trim())
            .filter(Boolean)
            .map(statement => `${statement};`)
            .sort();

          const allowed = [
            'ALTER TABLE "usuarios" DROP COLUMN "ultimo_acesso";',
            'DROP INDEX "devolutivas_manifestacao_id_idx";',
            'DROP INDEX "manifestacao_historico_manifestacao_id_idx";',
            'DROP INDEX "manifestacoes_criada_em_idx";',
            'DROP INDEX "manifestacoes_data_abertura_idx";',
            'DROP INDEX "manifestacoes_empresa_id_status_idx";',
            'DROP INDEX "manifestacoes_status_idx";',
            'DROP INDEX "rncs_data_abertura_idx";',
            'DROP INDEX "rncs_empresa_id_status_idx";',
            'DROP INDEX "tratativas_manifestacao_id_idx";',
            'DROP TABLE "pesquisa_respostas";',
            'DROP TABLE "relatorios_sac";',
            'DROP TABLE "solicitacoes_acesso";',
          ].sort();

          if (JSON.stringify(actual) !== JSON.stringify(allowed)) {
            console.error('A estrutura do Neon não corresponde à init mais os objetos adicionais aprovados.');
            console.error(`Comandos encontrados: ${actual.length}; esperados: ${allowed.length}.`);
            console.error(actual.join('\n') || '(nenhum comando)');
            process.exit(1);
          }
          console.log('As 29 estruturas da init estão presentes; somente 13 objetos adicionais previamente validados foram detectados.');
          console.log('Nenhuma tabela, coluna, índice ou FK existente será alterada nesta execução.');
          NODE

      - name: Registrar somente a migração init autorizada
        run: npx prisma migrate resolve --schema prisma/schema.prisma --applied 20260930000001_init

      - name: Confirmar que somente protocolos permanece pendente
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          set +e
          npx prisma migrate status --schema prisma/schema.prisma > "$status_file" 2>&1
          status_code=$?
          set -e
          cat "$status_file"
          if [ "$status_code" -gt 1 ]; then
            echo "O comando prisma migrate status falhou de forma inesperada (código $status_code)."
            exit "$status_code"
          fi

          STATUS_FILE="$status_file" DATABASE_URL="$DATABASE_URL" node <<'NODE'
          const fs = require('fs');
          const { Client } = require('pg');
          const output = fs.readFileSync(process.env.STATUS_FILE, 'utf8');
          if (output.includes('20260930000001_init') && /not yet been applied|pending|pendente/i.test(output)) {
            throw new Error('A migração init ainda aparece como pendente.');
          }
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: true } });
            await client.connect();
            const { rows } = await client.query(`
              SELECT migration_name, finished_at, rolled_back_at
                FROM "_prisma_migrations"
               ORDER BY started_at, migration_name
            `);
            await client.end();
            const pending = rows
              .filter(row => !row.finished_at || row.rolled_back_at)
              .map(row => row.migration_name);
            const expected = ['20261028000001_protocolos_atomicos'];
            if (JSON.stringify(pending) !== JSON.stringify(expected)) {
              throw new Error(`Migrações pendentes inesperadas: ${pending.join(', ') || '(nenhuma)'}`);
            }
            console.log('Baseline registrado. Somente 20261028000001_protocolos_atomicos permanece pendente.');
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
