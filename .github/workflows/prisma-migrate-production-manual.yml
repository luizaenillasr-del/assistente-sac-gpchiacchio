name: Verificar migrações Prisma (produção)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Digite PRODUCTION para confirmar o destino"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Verificar migrações no Neon production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.inputs.confirm_production == 'PRODUCTION' }}
    services:
      prisma-shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma-shadow-only
          POSTGRES_DB: prisma_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # A URL direta é usada somente durante esta execução administrativa.
      # O mesmo valor atende DATABASE_URL e DATABASE_URL_UNPOOLED porque o
      # schema do Prisma exige ambas as variáveis no carregamento.
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
      EXPECTED_NEON_HOSTNAME: ${{ secrets.NEON_PRODUCTION_HOSTNAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.NEON_PRODUCTION_DATABASE_NAME }}
      SHADOW_DATABASE_URL: postgresql://prisma:prisma-shadow-only@127.0.0.1:5432/prisma_shadow

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Confirmar destino Neon sem expor credenciais
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const parsed = new URL(process.env.DATABASE_URL);
          const expectedHost = process.env.EXPECTED_NEON_HOSTNAME;
          if (!expectedHost || parsed.hostname !== expectedHost) {
            throw new Error('Destino recusado: o host da conexão não corresponde ao host Neon de produção configurado.');
          }
          if (!process.env.EXPECTED_DATABASE_NAME) {
            throw new Error('Destino recusado: secret NEON_PRODUCTION_DATABASE_NAME não configurado.');
          }
          const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: true } });
          (async () => {
            await client.connect();
            const result = await client.query('SELECT current_database() AS database_name');
            const actual = String(result.rows[0]?.database_name || '');
            await client.end();
            if (actual !== process.env.EXPECTED_DATABASE_NAME) {
              throw new Error('Destino recusado: o nome do banco não corresponde ao banco Neon de produção configurado.');
            }
            console.log('Destino confirmado: host e banco Neon de produção correspondem aos valores esperados.');
          })().catch(async error => {
            try { await client.end(); } catch {}
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Comparar migração init com o Neon (somente leitura)
        run: |
          temp_migrations="$(mktemp -d)"
          cp prisma/migrations/migration_lock.toml "$temp_migrations/migration_lock.toml"
          cp -R prisma/migrations/20260930000001_init "$temp_migrations/20260930000001_init"
          diff_file="$(mktemp)"
          npx prisma migrate diff \
            --from-url "$DATABASE_URL_UNPOOLED" \
            --to-migrations "$temp_migrations" \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > "$diff_file"
          if [ -s "$diff_file" ]; then
            echo "A estrutura do Neon diverge da migração 20260930000001_init. Diff SQL somente leitura:"
            cat "$diff_file"
            exit 1
          fi
          echo "A estrutura do Neon é compatível com 20260930000001_init."

      - name: Verificar estado das migrações
        run: npx prisma migrate status
