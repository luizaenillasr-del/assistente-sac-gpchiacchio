name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar Prisma Client
        run: npx prisma generate
      - name: Rodar testes
        run: npm test
        env:
          NODE_ENV: test
