name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        # O postinstall da aplicação também executa db push; CI de testes não altera bancos.
        run: npm ci --ignore-scripts
      - name: Gerar Prisma Client
        run: npx prisma generate
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Rodar testes
        run: timeout --signal=TERM 15m npm test
        env:
          NODE_ENV: test
